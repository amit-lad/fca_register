name: monthly_update

on:
  # 06:00 UTC on the 1st of every month.
  schedule:
    - cron: '0 6 1 * *'
  # Also runnable by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_dashboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          # Pinned to the version the dashboard was built and tested with.
          version: 1.4.549
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
      - uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1  # Increment this number to invalidate the cache

      - name: Scrape the register and render the dashboard
        run: Rscript build_dashboard_github_actions.R

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frns.txt firms.csv smf_roles.csv _site
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Monthly update from GitHub Actions: $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
          fi
